<section class="library-document"><h2 class="library-document-title">链式法则：复合函数求导</h2><div class="tex-body"><h1 class="unnumbered" id="题目">题目</h1>
<p>求函数
<math display="inline" xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>f</mi><mrow><mo form="prefix" stretchy="true">(</mo><mi>x</mi><mo form="postfix" stretchy="true">)</mo></mrow><mo>=</mo><msup><mrow><mo form="prefix" stretchy="true">(</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn><mo form="postfix" stretchy="true">)</mo></mrow><mn>4</mn></msup></mrow><annotation encoding="application/x-tex">f(x)=(3x^2+1)^4</annotation></semantics></math>
的导数。</p>
<h1 class="unnumbered" id="解析">解析</h1>
<p>令
<math display="inline" xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>u</mi><mo>=</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">u=3x^2+1</annotation></semantics></math>，则
<math display="inline" xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>f</mi><mo>=</mo><msup><mi>u</mi><mn>4</mn></msup></mrow><annotation encoding="application/x-tex">f=u^4</annotation></semantics></math>。根据链式法则，
<math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mfrac><mrow><mi>d</mi><mi>f</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>d</mi><mi>f</mi></mrow><mrow><mi>d</mi><mi>u</mi></mrow></mfrac><mfrac><mrow><mi>d</mi><mi>u</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><mn>4</mn><msup><mi>u</mi><mn>3</mn></msup><mo>⋅</mo><mn>6</mn><mi>x</mi><mo>=</mo><mn>24</mn><mi>x</mi><msup><mrow><mo form="prefix" stretchy="true">(</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn><mo form="postfix" stretchy="true">)</mo></mrow><mn>3</mn></msup><mi>.</mi></mrow><annotation encoding="application/x-tex">\frac{df}{dx}=\frac{df}{du}\frac{du}{dx}
=4u^3\cdot6x=24x(3x^2+1)^3.</annotation></semantics></math></p>
<h1 class="unnumbered" id="答案">答案</h1>
<p><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><semantics><menclose notation="box"><mrow><mi>f</mi><mi>′</mi><mrow><mo form="prefix" stretchy="true">(</mo><mi>x</mi><mo form="postfix" stretchy="true">)</mo></mrow><mo>=</mo><mn>24</mn><mi>x</mi><msup><mrow><mo form="prefix" stretchy="true">(</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn><mo form="postfix" stretchy="true">)</mo></mrow><mn>3</mn></msup></mrow></menclose><annotation encoding="application/x-tex">\boxed{f'(x)=24x(3x^2+1)^3}</annotation></semantics></math></p>
</div></section>
